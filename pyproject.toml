[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serving-drift-gate"
version = "0.2.0"
description = "Deterministic offline release gate for LLM inference serving"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
serving-gate = "serving_gate.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

